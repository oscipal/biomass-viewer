name: biomass-viewer
# Conda environment for the biomass-viewer backend (Python 3.11).
# All geospatial packages come from conda-forge so that GDAL, rasterio,
# rio-tiler and rio-cogeo share the same underlying GDAL build (avoids the
# classic pip-wheel-vs-conda-GDAL conflicts).
#
#   conda env create -f environment.yml
#   conda activate biomass-viewer
#
channels:
  - conda-forge
dependencies:
  - python=3.11
  # --- geospatial stack (share one GDAL) ---
  - gdal>=3.7
  - rasterio>=1.3
  - rio-tiler>=6.4
  - rio-cogeo>=5.2
  - shapely>=2.0
  - pystac-client>=0.8
  # --- web / backend ---
  - fastapi>=0.110
  - uvicorn>=0.29
  - httpx>=0.27
  - requests>=2.31
  - python-dotenv>=1.0
  - pydantic-settings>=2.2
  - pip
  # Anything not on conda-forge could go here; currently everything is.
  - pip: []
